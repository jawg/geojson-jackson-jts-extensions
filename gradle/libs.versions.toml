[versions]
kotlin = "2.4.0"
versions-plugin = "0.54.0"
maven-publish-plugin = "0.37.0"
geojson-jackson = "1.3.0"
jts = "1.20.0"

[libraries]
geojson-jackson = { module = "io.jawg.geojson:geojson-jackson", version.ref = "geojson-jackson" }
jts = { module = "org.locationtech.jts:jts-core", version.ref = "jts" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "versions-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish-plugin" }
